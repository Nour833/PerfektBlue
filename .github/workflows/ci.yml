name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src/perfektblue
      - name: Dependency audit
        run: pip-audit
      - name: Test
        run: pytest
      - name: Validate profiles and modules
        run: |
          perfektblue --backend simulated profiles validate
          perfektblue --backend simulated modules validate

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils lintian
      - name: Validate desktop entry
        run: desktop-file-validate assets/perfektblue.desktop
      - name: Build Python distributions
        run: |
          python -m build --outdir dist .
          python -m build --outdir dist plugins/perfektblue-can
      - name: Build Debian package
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.updated_at }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python scripts/build_deb.py
      - name: Validate Debian package
        run: |
          lintian --fail-on error dist/*.deb
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: Clean Debian installation smoke test
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm-slim sh -c \
            'apt-get update && apt-get install -y /dist/perfektblue_*.deb && perfektblue --version && perfektblue --backend simulated --json discover'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perfektblue-build
          path: dist/
          if-no-files-found: error
