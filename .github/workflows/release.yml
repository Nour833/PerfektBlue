name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Require annotated version tag
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"
          python scripts/check_version.py --tag "$GITHUB_REF_NAME"
      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils lintian
      - name: Run quality gates
        run: |
          ruff check .
          ruff format --check .
          mypy src/perfektblue
          pip-audit
          pytest
          desktop-file-validate assets/perfektblue.desktop
          perfektblue --backend simulated profiles validate
          perfektblue --backend simulated modules validate
      - name: Build release artifacts
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m build --outdir dist .
          python -m build --outdir dist plugins/perfektblue-can
          python scripts/build_deb.py
      - name: Validate and smoke-test Debian package
        run: |
          lintian --fail-on error dist/*.deb
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm-slim sh -c \
            'apt-get update && apt-get install -y /dist/perfektblue_*.deb && perfektblue --version && perfektblue --backend simulated --json discover'
      - name: Generate checksums and SBOM
        run: |
          cd dist
          sha256sum *.deb *.whl *.tar.gz > SHA256SUMS
          cd ..
          python scripts/generate_sbom.py --output dist/perfektblue-${GITHUB_REF_NAME}-sbom.spdx.json dist/*.deb dist/*.whl dist/*.tar.gz
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.deb
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.spdx.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --notes-file "$NOTES_FILE" \
              --title "PerfektBlue ${GITHUB_REF_NAME} — Bluetooth-first adaptive framework"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "PerfektBlue ${GITHUB_REF_NAME}"
          fi
