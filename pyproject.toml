[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfektblue"
version = "2.1.0"
description = "Bluetooth-first adaptive security assessment framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nour833" }]
keywords = ["bluetooth", "bluez", "security", "automotive", "assessment"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "dbus-next>=0.2.3",
  "rich>=13.9",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pip-audit>=2.8",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
perfektblue = "perfektblue.cli:main"

[project.entry-points."perfektblue.modules"]
service-exposure = "perfektblue.modules.builtin:ServiceExposureModule"
security-posture = "perfektblue.modules.builtin:SecurityPostureModule"
simulated-canary = "perfektblue.modules.builtin:SimulatedCanaryModule"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perfektblue = ["data/profiles/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["perfektblue"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=perfektblue --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
